<style>
        .glass-card {
            background: rgba(30, 32, 32, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .glow-active {
            box-shadow: 0 0 30px rgba(251, 207, 232, 0.2);
            border-color: rgba(251, 207, 232, 0.5) !important;
        }
        .btn-glow {
            box-shadow: 0 4px 20px rgba(251, 207, 232, 0.3);
            transition: all 0.3s ease;
        }
        .btn-glow:hover {
            box-shadow: 0 6px 25px rgba(251, 207, 232, 0.5);
            transform: translateY(-1px);
        }
    </style>
<script>
    function selectCard(selectedId) {
        const cards = document.querySelectorAll('.role-card');
        cards.forEach(card => {
            const checkIcon = card.querySelector('.check-icon');
            if (card.id === selectedId) {
                card.classList.add('glow-active');
                card.classList.remove('border-outline-variant');
                card.classList.add('border-brand-lavender/50');
                checkIcon.classList.remove('opacity-0');
                checkIcon.classList.add('opacity-100');
            } else {
                card.classList.remove('glow-active');
                card.classList.remove('border-brand-lavender/50');
                card.classList.add('border-outline-variant');
                checkIcon.classList.remove('opacity-100');
                checkIcon.classList.add('opacity-0');
            }
        });
    }
</script>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-tertiary selection:text-on-tertiary">

<div class="w-12 h-12 rounded-full bg-brand-teal/20 flex items-center justify-center text-brand-lavender">
<span class="material-symbols-outlined text-3xl" data-icon="school" data-weight="fill" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<div>
<h3 class="text-headline-sm font-headline-sm text-on-surface mb-2">Student</h3>
<p class="text-body-md font-body-md text-on-surface-variant leading-relaxed">I'm here to learn and track my progress through guided materials.</p>
</div>
<div class="mt-auto pt-4 w-full flex justify-end check-icon opacity-100 transition-opacity">
<span class="material-symbols-outlined text-brand-lavender">check_circle</span>
</div>
</button>
<!-- Card 2: Teacher -->
<button class="role-card glass-card rounded-[24px] p-card-inner-padding text-left flex flex-col items-start gap-4 border border-outline-variant hover:border-brand-lavender/50 transition-all duration-300 group hover:-translate-y-1 focus:outline-none focus:ring-2 focus:ring-brand-lavender/30" id="card-teacher" onclick="selectCard('card-teacher')">

</div>
<div class="mt-auto pt-4 w-full flex justify-end check-icon opacity-0 transition-opacity">

</button>
