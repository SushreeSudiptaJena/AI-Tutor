<style>
        /* Custom Styles for Glassmorphism & Glow Effects */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }
        
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .glass-card.selected {
            background: rgba(184, 244, 115, 0.08); /* tertiary-fixed tint */
            border-color: #9dd75b; /* colors.tertiary */
            box-shadow: 0 0 30px rgba(184, 244, 115, 0.15);
        }
        
        .btn-primary-glow {
            background: linear-gradient(135deg, #9dd75b 0%, #70a62f 100%); /* colors.tertiary -> colors.on-tertiary-container */
            box-shadow: 0 4px 20px rgba(184, 244, 115, 0.3);
            transition: all 0.3s ease;
        }
        
        .btn-primary-glow:hover {
            box-shadow: 0 6px 25px rgba(184, 244, 115, 0.5);
            transform: translateY(-1px);
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center font-body-md overflow-x-hidden selection:bg-tertiary selection:text-on-tertiary relative">
<!-- TopAppBar Shell Suppressed for Linear/Transactional Flow -->
<!-- Main Content Container -->
<main class="w-full max-w-4xl px-container-padding py-section-gap flex flex-col items-center justify-center flex-grow z-10 relative">
<!-- Step Indicator -->
<div class="mb-8">
<span class="text-on-surface-variant font-label-md text-label-md tracking-widest uppercase">Step 2 of 2</span>
</div>
<!-- Heading -->
<div class="text-center mb-12 max-w-2xl">
<!-- Note: User requested elegant serif, but design system dictates Hanken Grotesk. Sticking to design system for consistency but using display typography. -->
<h1 class="font-display-lg text-display-lg text-primary tracking-tight mb-4">What will you use this for?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Select all that apply to help us tailor your AI-assisted research environment.</p>
</div>
<!-- Selection Grid -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-gutter w-full mb-section-gap">
<!-- Option 1: Homework help -->
<button aria-pressed="false" class="glass-card rounded-xl p-card-inner-padding flex flex-col items-center justify-center gap-4 text-center group cursor-pointer h-48 focus:outline-none focus:ring-2 focus:ring-tertiary" onclick="this.classList.toggle('selected');">
<span class="material-symbols-outlined text-4xl text-on-surface-variant group-hover:text-primary transition-colors" data-icon="book" style="font-variation-settings: 'FILL' 0;">book</span>
<span class="font-headline-sm text-headline-sm text-on-surface">Homework help</span>
</button>
<!-- Option 2: Exam preparation -->
<button aria-pressed="false" class="glass-card rounded-xl p-card-inner-padding flex flex-col items-center justify-center gap-4 text-center group cursor-pointer h-48 focus:outline-none focus:ring-2 focus:ring-tertiary" onclick="this.classList.toggle('selected');">
<span class="material-symbols-outlined text-4xl text-on-surface-variant group-hover:text-primary transition-colors" data-icon="school" style="font-variation-settings: 'FILL' 0;">school</span>
<span class="font-headline-sm text-headline-sm text-on-surface">Exam preparation</span>
</button>
<!-- Option 3: Coding (Pre-selected) -->
<button aria-pressed="true" class="glass-card selected rounded-xl p-card-inner-padding flex flex-col items-center justify-center gap-4 text-center group cursor-pointer h-48 focus:outline-none focus:ring-2 focus:ring-tertiary" onclick="this.classList.toggle('selected');">
<span class="material-symbols-outlined text-4xl text-tertiary transition-colors" data-icon="code" style="font-variation-settings: 'FILL' 1;">code</span>
<span class="font-headline-sm text-headline-sm text-on-surface">Coding / Technical learning</span>
</button>
<!-- Option 4: Creative / Design -->
<button aria-pressed="false" class="glass-card rounded-xl p-card-inner-padding flex flex-col items-center justify-center gap-4 text-center group cursor-pointer h-48 focus:outline-none focus:ring-2 focus:ring-tertiary" onclick="this.classList.toggle('selected');">
<span class="material-symbols-outlined text-4xl text-on-surface-variant group-hover:text-primary transition-colors" data-icon="palette" style="font-variation-settings: 'FILL' 0;">palette</span>
<span class="font-headline-sm text-headline-sm text-on-surface">Creative / Design learning</span>
</button>
<!-- Option 5: General knowledge (Pre-selected) -->
<button aria-pressed="true" class="glass-card selected rounded-xl p-card-inner-padding flex flex-col items-center justify-center gap-4 text-center group cursor-pointer h-48 focus:outline-none focus:ring-2 focus:ring-tertiary" onclick="this.classList.toggle('selected');">
<span class="material-symbols-outlined text-4xl text-tertiary transition-colors" data-icon="public" style="font-variation-settings: 'FILL' 1;">public</span>
<span class="font-headline-sm text-headline-sm text-on-surface">General knowledge / Curiosity</span>
</button>
<!-- Option 6: Other -->
<button aria-pressed="false" class="glass-card rounded-xl p-card-inner-padding flex flex-col items-center justify-center gap-4 text-center group cursor-pointer h-48 focus:outline-none focus:ring-2 focus:ring-tertiary" onclick="this.classList.toggle('selected');">
<span class="material-symbols-outlined text-4xl text-on-surface-variant group-hover:text-primary transition-colors" data-icon="more_horiz" style="font-variation-settings: 'FILL' 0;">more_horiz</span>
<span class="font-headline-sm text-headline-sm text-on-surface">Other</span>
</button>
</div>
</main>
<!-- Footer Component (Shared JSON execution) -->
<!-- Content: exact strings. Styles: style_ keys mapped. -->
<footer class="bg-transparent fixed bottom-0 w-full flex flex-col items-center justify-center pb-8 gap-2 z-20">
<!-- Primary Action -->
<button class="btn-primary-glow text-on-tertiary font-label-md text-label-md px-8 py-3 rounded-full mb-4 w-64 text-center flex justify-center items-center gap-2">
            Continue
            <span class="material-symbols-outlined text-xl" data-icon="arrow_forward" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>

</footer>
